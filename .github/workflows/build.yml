# Compiles Murmur on a real Mac so a broken build is caught on push,
# not when you next run ./build.sh --install.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app bundle
        run: ./build.sh
      - name: Check the bundle
        run: |
          test -x build/VoZ.app/Contents/MacOS/VoZ
          test -f build/VoZ.app/Contents/Resources/AppIcon.icns
          plutil -lint build/VoZ.app/Contents/Info.plist
          codesign --verify --verbose build/VoZ.app
